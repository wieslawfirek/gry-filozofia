<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W5 – Galileusz</title><style>body{font:17px system-ui;background:#f4f0e8;color:#182c3b;margin:0}main{max-width:790px;margin:auto;padding:28px 18px}h1{font-family:Georgia;font-size:2.3rem}article{background:#fff;border:1px solid #d8cbb8;border-radius:18px;padding:22px;margin:16px 0}label{display:block;padding:10px;border:1px solid #d9dedf;border-radius:9px;margin:8px 0;cursor:pointer}label:has(input:checked){background:#e8f1ed;border-color:#315c56}button{background:#1d4c49;color:white;padding:14px 24px;border:0;border-radius:10px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.feedback{padding:10px;border-radius:8px;background:#eef2f3;margin-top:10px}a{color:#175953}small{color:#536773}</style></head><body><main><a href="../">← Wszystkie testy</a><p>Siłownia filozoficzna · Wykład 5</p><h1>Galileusz – test wiedzy</h1><p>15 pytań. Wybierz jedną odpowiedź w każdym zadaniu. Po sprawdzeniu poznasz wynik i uzasadnienia.</p><div id="questions"></div><button id="check" onclick="grade()">Sprawdź odpowiedzi</button><p id="result" role="status"></p><button id="again" hidden onclick="location.reload()">Rozwiąż ponownie</button><p><small>Na podstawie: W. Tatarkiewicz, Historia filozofii, t. II, rozdział „Galileusz”.</small></p></main><script>const qs=[["Co jest podstawą poznania przyrody u Galileusza?",["Wyłącznie autorytet filozofów","Obserwacja i eksperyment połączone z rozumowaniem","Sama intuicja","Wyłącznie dedukcja"],1,"Doświadczenie wymaga współpracy z rozumowaniem."],["Co oznacza matematyzacja przyrody?",["Zastąpienie obserwacji liczbami","Ograniczenie nauki do geometrii","Opisywanie mierzalnych zależności językiem matematyki","Odrzucenie eksperymentów"],2,"Matematyka pozwala ujmować prawidłowości zjawisk."],["Które właściwości Galileusz uznawał za szczególnie ważne w opisie przyrody?",["Kształt i ruch","Piękno i cel","Wartość moralną i użyteczność","Autorytet i tradycję"],0,"Kształt i ruch podlegają opisowi ilościowemu."],["Czym jest analiza w metodzie Galileusza?",["Ustalaniem celów przyrody","Oceną autorytetów","Przypadkowym zbieraniem faktów","Rozkładaniem złożonego zjawiska na składniki"],3,"Analiza wyodrębnia elementy i zależności."],["Czym jest synteza?",["Odrzuceniem hipotez bez sprawdzenia","Odtwarzaniem zależności z elementów","Poszukiwaniem ukrytych celów","Zastąpieniem matematyki obserwacją"],1,"Synteza pozwala powiązać składniki w wyjaśnienie."],["Które stwierdzenie najlepiej opisuje Galileusza?",["Był zwolennikiem wyłącznie doświadczenia","Odrzucał matematykę","Łączył doświadczenie z matematyką","Uznawał wyłącznie autorytet Arystotelesa"],2,"Nie był jednostronnym empirystą."],["Co przede wszystkim powinna badać nauka?",["Zjawiska, właściwości i prawidłowości","Ukryte istoty niedostępne badaniu","Moralne cele przedmiotów","Tylko historię filozofii"],0,"Przedmiotem badania są dostępne poznaniu zjawiska."],["Co oznacza odejście od finalizmu?",["Zaprzeczenie istnieniu wszelkich przyczyn","Zaniechanie badań nad ruchem","Wyjaśnianie zjawisk przez ich przeznaczenie","Poszukiwanie przyczyn zamiast przypisywanych celów"],3,"Naukowe wyjaśnienie ma wskazywać przyczyny i prawa."],["Badacz mierzy czas biegu na różnych dystansach i tworzy model zależności. Co ilustruje?",["Wyłącznie rozumowanie spekulatywne","Połączenie pomiaru i matematyki","Wyjaśnienie celowościowe","Odrzucenie eksperymentu"],1,"To przykład współpracy danych i modelu."],["Jak Galileusz odnosił się do tradycyjnego arystotelizmu?",["Przyjmował go bez zastrzeżeń","Odrzucał wszelkie badanie przyrody","Krytykował jego spekulatywne i celowościowe wyjaśnienia","Uważał go za teorię matematyczną"],2,"Krytykował sposoby wyjaśniania oderwane od doświadczenia."],["Prawda czy fałsz: Samo zebranie wielu obserwacji wystarcza do ścisłej nauki.",["Prawda","Fałsz"],1,"Potrzebne jest również matematyczne rozumowanie."],["Prawda czy fałsz: Galileusz podkreślał rolę mierzalnych cech zjawisk.",["Fałsz","Prawda"],1,"Pomiar umożliwia ścisły opis."],["Prawda czy fałsz: Wyjaśnienie celu istnienia zjawiska jest dla Galileusza głównym zadaniem przyrodoznawstwa.",["Prawda","Fałsz"],1,"Priorytetem jest badanie przyczyn i prawidłowości."],["Czym różni się akcent Galileusza od programu Bacona?",["Galileusz szczególnie podkreśla matematyczny opis i dedukcję","Galileusz odrzucał eksperyment","Bacon uważał matematykę za jedyne źródło wiedzy","Obaj wykluczali rozumowanie"],0,"Bacon akcentował indukcję, Galileusz matematyczne rozumowanie z doświadczeniem."],["Co najlepiej oddaje filozoficzne znaczenie Galileusza?",["Przywrócenie wyjaśnień celowościowych","Odrzucenie wszelkiej teorii","Zastąpienie pomiaru autorytetem","Rozwój metody łączącej doświadczenie i matematykę"],3,"To istotny krok w rozwoju nowożytnego przyrodoznawstwa."]];document.getElementById('questions').innerHTML=qs.map((q,i)=>'<article id="q'+i+'"><h3>'+(i+1)+'. '+q[0]+'</h3>'+q[1].map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+a+'</label>').join('')+'<div class="feedback" hidden></div></article>').join('');function grade(){let n=0,missing=0;qs.forEach((q,i)=>{const v=document.querySelector('input[name=q'+i+']:checked');if(!v)missing++});if(missing){alert('Odpowiedz na wszystkie pytania. Pozostało: '+missing);return}qs.forEach((q,i)=>{const v=Number(document.querySelector('input[name=q'+i+']:checked').value),ok=v===q[2];if(ok)n++;const f=document.querySelector('#q'+i+' .feedback');f.hidden=false;f.textContent=(ok?'✓ Poprawnie. ':'✗ Poprawna odpowiedź: '+q[1][q[2]]+'. ')+q[3]});document.querySelectorAll('input').forEach(x=>x.disabled=true);document.getElementById('check').hidden=true;document.getElementById('again').hidden=false;document.getElementById('result').innerHTML='<h2>Wynik: '+n+'/15 ('+Math.round(n/15*100)+'%)</h2>';document.getElementById('result').scrollIntoView({behavior:'smooth'})}</script></body></html>
